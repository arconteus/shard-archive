[project]
name = "shard-archive-api"
version = "0.1.0"
description = "Local API for Shard Archive"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1,<2.0",
    "fastapi>=0.116,<1.0",
    "sqlalchemy>=2.0.52,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
    "ruff>=0.15,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shard_archive_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

